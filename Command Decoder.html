<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Command Decoder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: annotated manual. Terminal input on top, a colour-coded anatomy line, then one breakdown card per pipeline stage.
   Colour lives only in the token kinds (command, option, value...); the page chrome stays neutral slate. */
:root {
  --bg: oklch(0.972 0.006 245);
  --surface: oklch(0.996 0.003 245);
  --surface-2: oklch(0.953 0.008 245);
  --ink: oklch(0.24 0.025 255);
  --ink-2: oklch(0.46 0.02 255);
  --line: oklch(0.89 0.01 250);
  --accent: oklch(0.27 0.03 255);
  --accent-ink: oklch(0.985 0.004 245);
  --focus: oklch(0.55 0.17 255);
  --danger-bg: oklch(0.95 0.04 25); --danger-fg: oklch(0.42 0.15 25); --danger-bd: oklch(0.82 0.08 25);
  --caution-bg: oklch(0.96 0.06 85); --caution-fg: oklch(0.42 0.1 70); --caution-bd: oklch(0.84 0.1 85);
  --info-bg: oklch(0.95 0.025 245); --info-fg: oklch(0.38 0.07 250); --info-bd: oklch(0.84 0.04 250);
  --k-bg-l: 0.925; --k-bg-c: 0.055; --k-fg-l: 0.36; --k-fg-c: 0.14; --k-bd-l: 0.8; --k-bd-c: 0.08;
  --h-command: 255; --h-sub: 305; --h-option: 72; --h-value: 150; --h-arg: 205; --h-op: 25; --h-redir: 350; --h-env: 175;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.19 0.015 255); --surface: oklch(0.235 0.016 255); --surface-2: oklch(0.275 0.016 255);
    --ink: oklch(0.94 0.008 250); --ink-2: oklch(0.74 0.015 250); --line: oklch(0.34 0.015 255);
    --accent: oklch(0.93 0.01 250); --accent-ink: oklch(0.2 0.02 255); --focus: oklch(0.72 0.14 255);
    --danger-bg: oklch(0.3 0.07 25); --danger-fg: oklch(0.88 0.08 25); --danger-bd: oklch(0.45 0.1 25);
    --caution-bg: oklch(0.31 0.06 85); --caution-fg: oklch(0.88 0.09 85); --caution-bd: oklch(0.46 0.08 85);
    --info-bg: oklch(0.28 0.03 250); --info-fg: oklch(0.86 0.04 250); --info-bd: oklch(0.42 0.05 250);
    --k-bg-l: 0.32; --k-bg-c: 0.07; --k-fg-l: 0.9; --k-fg-c: 0.1; --k-bd-l: 0.46; --k-bd-c: 0.09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.19 0.015 255); --surface: oklch(0.235 0.016 255); --surface-2: oklch(0.275 0.016 255);
  --ink: oklch(0.94 0.008 250); --ink-2: oklch(0.74 0.015 250); --line: oklch(0.34 0.015 255);
  --accent: oklch(0.93 0.01 250); --accent-ink: oklch(0.2 0.02 255); --focus: oklch(0.72 0.14 255);
  --danger-bg: oklch(0.3 0.07 25); --danger-fg: oklch(0.88 0.08 25); --danger-bd: oklch(0.45 0.1 25);
  --caution-bg: oklch(0.31 0.06 85); --caution-fg: oklch(0.88 0.09 85); --caution-bd: oklch(0.46 0.08 85);
  --info-bg: oklch(0.28 0.03 250); --info-fg: oklch(0.86 0.04 250); --info-bd: oklch(0.42 0.05 250);
  --k-bg-l: 0.32; --k-bg-c: 0.07; --k-fg-l: 0.9; --k-fg-c: 0.1; --k-bd-l: 0.46; --k-bd-c: 0.09;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.brand h1 { font-family: var(--font-head); font-weight: 600; font-size: clamp(1.6rem, 4.2vw, 2.1rem); letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--ink-2); max-width: 46ch; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { appearance: none; border: 0; background: transparent; padding: 8px 16px; border-radius: 7px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; min-width: 7.5rem; }
.seg button b { font-family: var(--font-head); font-weight: 600; font-size: 0.98rem; }
.seg button span { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-2); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-checked="true"] span { color: inherit; opacity: 0.75; }
.seg button:not([aria-checked="true"]):hover { background: var(--surface); }

/* terminal input */
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.term-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.75rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
.shell-badge { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; font-size: 0.74rem; }
.prompt-row { display: flex; gap: 10px; align-items: flex-start; }
.prompt { font-family: var(--font-mono); font-size: 1rem; color: var(--ink-2); padding-top: 9px; white-space: nowrap; user-select: none; }
#cmd { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; overflow: hidden; }
#cmd::placeholder { color: var(--ink-2); opacity: 0.7; }
.clear { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; color: var(--ink-2); font-size: 0.85rem; }
.clear:hover { background: var(--surface-2); color: var(--ink); }
.tryrow { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tryrow .lbl { font-size: 0.78rem; color: var(--ink-2); margin-right: 2px; }
.ex { appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 11px; font-family: var(--font-mono); font-size: 0.78rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex:hover { border-color: var(--ink-2); }

/* kinds */
.chip { --h: var(--h-arg); font-family: var(--font-mono); font-weight: 500; border-radius: 4px; padding: 1px 3px; margin: 0 .5px; background: oklch(var(--k-bg-l) var(--k-bg-c) var(--h)); color: oklch(var(--k-fg-l) var(--k-fg-c) var(--h)); box-shadow: inset 0 0 0 1px oklch(var(--k-bd-l) var(--k-bd-c) var(--h)); white-space: pre-wrap; overflow-wrap: anywhere; cursor: default; transition: box-shadow .12s, transform .12s; }
.k-command { --h: var(--h-command); font-weight: 600; } .k-sub { --h: var(--h-sub); font-weight: 600; } .k-option { --h: var(--h-option); }
.k-value { --h: var(--h-value); } .k-arg { --h: var(--h-arg); } .k-op { --h: var(--h-op); font-weight: 600; } .k-redir { --h: var(--h-redir); font-weight: 600; }
.k-target { --h: var(--h-redir); } .k-env { --h: var(--h-env); }
.k-unknown, .k-comment { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); border-style: dashed; text-decoration: underline dotted var(--ink-2); text-underline-offset: 3px; }
.k-comment { text-decoration: none; font-style: italic; }
.hl { box-shadow: inset 0 0 0 2px var(--ink) !important; }
.row.hl { box-shadow: none !important; background: var(--surface-2); }

/* banners */
.banners { display: flex; flex-direction: column; gap: 10px; }
.banner { border: 1px solid; border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.banner b { font-family: var(--font-head); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; flex: none; }
.banner p { margin: 0; flex: 1 1 18rem; min-width: 0; }
.banner button { appearance: none; cursor: pointer; border: 1px solid currentColor; background: transparent; border-radius: 7px; padding: 3px 10px; font-size: 0.82rem; color: inherit; }
.banner.danger { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-bd); }
.banner.caution { background: var(--caution-bg); color: var(--caution-fg); border-color: var(--caution-bd); }
.banner.info { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-bd); }
.banner code { font-family: var(--font-mono); font-size: 0.9em; }

/* sections */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px; min-width: 0; }
.card h2, .sec-title { font-family: var(--font-head); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); margin: 0 0 12px; }
.anatomy { font-family: var(--font-mono); font-size: 1.05rem; line-height: 2.2; overflow-wrap: anywhere; white-space: pre-wrap; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 0.78rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: oklch(var(--k-bg-l) var(--k-bg-c) var(--h, var(--h-arg))); box-shadow: inset 0 0 0 1px oklch(var(--k-bd-l) var(--k-bd-c) var(--h, var(--h-arg))); }
.legend i.k-unknown { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-2); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.step { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr); gap: 2px 10px; }
.step .n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); width: 1.6rem; height: 1.6rem; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; margin-top: 2px; }
.step .txt { font-size: 1.04rem; font-weight: 500; min-width: 0; }
.step .sub { margin: 3px 0 0; font-size: 0.86rem; color: var(--ink-2); min-width: 0; }
.step .sub code { font-family: var(--font-mono); font-size: 0.92em; color: var(--ink); background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
.step .sub .sep { opacity: 0.45; margin: 0 4px; }
.conn { grid-column: 2; font-size: 0.82rem; color: var(--ink-2); padding: 6px 0 2px; display: flex; gap: 8px; align-items: center; }
.conn .chip { font-size: 0.8rem; }

.unit { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.unit-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.unit-head .stage { font-family: var(--font-head); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); }
.unit-head .head-text { font-weight: 500; min-width: 0; flex: 1 1 14rem; }
.row { display: grid; grid-template-columns: minmax(7rem, 15rem) minmax(0, 1fr); gap: 4px 18px; padding: 11px 16px; border-top: 1px solid var(--line); }
.unit-head + .row { border-top: 0; }
.row .tok { min-width: 0; padding-top: 1px; }
.row .tok .chip { display: inline-block; max-width: 100%; }
.what { min-width: 0; }
.what .kind { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; }
.what .kind em { font-style: normal; font-family: var(--font-mono); text-transform: none; letter-spacing: 0; font-weight: 500; }
.what p { margin: 1px 0 0; }
.what .more { margin: 3px 0 0; font-size: 0.86rem; color: var(--ink-2); }
.what .more.eq { font-size: 0.82rem; }
.what code { font-family: var(--font-mono); font-size: 0.92em; background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
.joiner { display: grid; grid-template-columns: minmax(7rem, 15rem) minmax(0, 1fr); gap: 4px 18px; align-items: start; padding: 2px 16px; }
.joiner .tok { text-align: left; }
.joiner .what p { margin: 0; }
.joiner.hl { background: var(--surface-2); }
.link { background: transparent; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.empty { text-align: left; color: var(--ink-2); padding: 28px 4px; }
.empty b { font-family: var(--font-head); color: var(--ink); font-size: 1.1rem; display: block; margin-bottom: 4px; }

details.lib { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0; }
details.lib summary { cursor: pointer; padding: 14px 18px; font-family: var(--font-head); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.lib summary::-webkit-details-marker { display: none; }
details.lib summary::after { content: "+"; font-family: var(--font-mono); }
details.lib[open] summary::after { content: "\2212"; }
.lib-body { padding: 0 18px 16px; display: flex; flex-wrap: wrap; gap: 6px; }
.lib-body .ex { background: var(--surface-2); }
footer { color: var(--ink-2); font-size: 0.8rem; }

@media (max-width: 640px) {
  .row, .joiner { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .seg { width: 100%; } .seg button { flex: 1; min-width: 0; }
  .prompt { padding-top: 9px; }
  .anatomy { font-size: 0.95rem; }
}
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Command Decoder</h1>
      <p>Type a command line and see what it does, one piece at a time.</p>
    </div>
    <div class="seg" role="radiogroup" aria-label="Operating system" id="osSeg">
      <button type="button" role="radio" aria-checked="true" data-os="linux" id="osLinux"><b>Linux</b><span>bash &middot; GNU tools</span></button>
      <button type="button" role="radio" aria-checked="false" data-os="windows" id="osWindows"><b>Windows</b><span>cmd &middot; PowerShell</span></button>
    </div>
  </header>

  <section class="term" aria-label="Command input">
    <div class="term-bar"><label for="cmd">Command line</label><span class="shell-badge" id="shellBadge">bash</span></div>
    <div class="prompt-row">
      <span class="prompt" id="prompt">$</span>
      <textarea id="cmd" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-describedby="shellBadge" placeholder="e.g. ls -la /var/log"></textarea>
      <button type="button" class="clear" id="clearBtn" aria-label="Clear the command">Clear</button>
    </div>
    <div class="tryrow" id="tryRow"></div>
  </section>

  <main id="out" class="stack" aria-live="polite"></main>

  <details class="lib" id="lib">
    <summary><span id="libTitle">Commands I can explain</span></summary>
    <div class="lib-body" id="libBody"></div>
  </details>
  <footer id="foot"></footer>
</div>

<script>
/* ============ Command database: core helpers ============ */
const DB = { linux: {}, windows: {} };

/* Flag DSL, one flag per line:  "-a --all | description"
   "-n=NUM --lines=NUM | ..."  => takes a value;  "--color[=WHEN]" => optional attached value */
function parseFlagText(text) {
  const out = [];
  (text || '').split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    const i = line.indexOf('|');
    const formsStr = line.slice(0, i).trim();
    const d = line.slice(i + 1).trim();
    const forms = formsStr.split(/[\s,]+/).filter(Boolean).map(f => {
      const m = f.match(/^(--|-|\/)([^=\[]+)(\[=([^\]]+)\]|=(.+))?$/);
      return { text: m[1] + m[2], pre: m[1], name: m[2], arg: m[5] || m[4] || null, optional: !!m[4] };
    });
    const argForm = forms.find(f => f.arg);
    out.push({ forms, d, arg: argForm ? argForm.arg : null, optional: forms.some(f => f.optional) });
  });
  return out;
}

function indexFlags(flags) {
  const idx = { short: {}, long: {}, single: {}, any: {} };
  flags.forEach(f => f.forms.forEach(fm => {
    const k = fm.name;
    if (fm.pre === '--') idx.long[k] = f;
    else if (fm.pre === '-' && k.length === 1) idx.short[k] = f;
    else if (fm.pre === '-') idx.single[k] = f;
    idx.any[k.toLowerCase()] = f;
  }));
  return idx;
}

/* Argument DSL: "LABEL|description", a trailing * on LABEL means it repeats */
function parseArgs(a) {
  return (a || []).map(s => {
    const i = s.indexOf('|');
    let label = s.slice(0, i);
    const rep = label.endsWith('*');
    if (rep) label = label.slice(0, -1);
    return { label, rep, d: s.slice(i + 1) };
  });
}

/* o = { f: flags, a: args[], last: 'LABEL|desc', s: subcommands, wrap, skip, eq, note,
         cluster, num, kw, kv, dyn, old, ps } */
function build(os, names, d, o, parent) {
  o = o || {};
  names = [].concat(names);
  const spec = {
    os, name: names[0], names, d, parent: parent || null,
    flags: parseFlagText(o.f), args: parseArgs(o.a),
    last: o.last ? parseArgs([o.last])[0] : null,
    wrap: !!o.wrap, skip: o.skip || 0,
    eq: o.eq || null, note: o.note || null,
    cluster: !!o.cluster, num: o.num || null,
    kw: o.kw || {}, kv: o.kv || null, dyn: o.dyn || {}, vdyn: o.vdyn || {}, plus: o.plus || null,
    old: !!o.old, ps: !!o.ps,
    alias: o.alias || null,
    subs: {}, subList: []
  };
  spec.idx = indexFlags(spec.flags);
  if (o.s) {
    for (const key in o.s) {
      const entry = o.s[key];
      const sub = build(os, key.split('|'), entry[0], entry[1] || {}, spec);
      sub.names.forEach(n => { spec.subs[os === 'linux' ? n : n.toLowerCase()] = sub; });
      spec.subList.push(sub);
    }
  }
  return spec;
}

function C(os, names, d, o) {
  const spec = build(os, names, d, o, null);
  spec.names.forEach(n => { DB[os][os === 'linux' ? n : n.toLowerCase()] = spec; });
  return spec;
}
const L = (n, d, o) => C('linux', n, d, o);
const W = (n, d, o) => C('windows', n, d, o);

/* ---------- dynamic argument explainers ---------- */
function chmodDesc(v) {
  if (/^[0-7]{3,4}$/.test(v)) {
    const m = v.slice(-3);
    const w = ['---', '--x', '-w-', '-wx', 'r--', 'r-x', 'rw-', 'rwx'];
    return `Octal mode ${v}: owner ${w[m[0]]}, group ${w[m[1]]}, others ${w[m[2]]} (read=4, write=2, execute=1, added together).` +
      (v.length === 4 ? ' The extra leading digit sets setuid/setgid/sticky bits.' : '');
  }
  if (/^([ugoa]*[-+=][rwxXst]*)(,[ugoa]*[-+=][rwxXst]*)*$/.test(v)) {
    const who = { u: 'the owner', g: 'the group', o: 'everyone else', a: 'everyone' };
    const perm = { r: 'read', w: 'write', x: 'execute', X: 'execute (if directory)', s: 'setuid/setgid', t: 'sticky bit' };
    return 'Symbolic mode: ' + v.split(',').map(c => {
      const m = c.match(/^([ugoa]*)([-+=])([rwxXst]*)$/);
      const ws = (m[1] || 'a').split('').map(x => who[x]).join(' and ');
      const ps = m[3].split('').map(x => perm[x]).join(', ') || 'nothing';
      const verb = { '+': 'adds', '-': 'removes', '=': 'sets exactly' }[m[2]];
      return `${verb} ${ps} for ${ws}`;
    }).join('; ') + '.';
  }
  return null;
}
function chownDesc(v) {
  const m = v.match(/^([^:.]*)(?:[:.](.*))?$/);
  if (!m) return 'New owner (and optionally group) as user:group.';
  const parts = [];
  if (m[1]) parts.push(`owner becomes "${m[1]}"`);

function fwdDesc(v) {
  const p = v.split(':');
  if (p.length === 3) return `Port ${p[0]} is forwarded to ${p[1]}:${p[2]} through the tunnel.`;

  return null;
}

  let m = v.match(/^HEAD~(\d+)$/);

/* ============ Windows: PowerShell cmdlets ============ */
DB.psAlias = {};
const PS_COMMON = parseFlagText(`
-Verbose | Print extra detail about what the command is doing
-Debug | Print debugging information
-ErrorAction=ACTION | What to do on errors: Stop, Continue, SilentlyContinue, Ignore, Inquire
-WarningAction=ACTION | What to do on warnings
-ErrorVariable=VAR | Store errors in this variable
-OutVariable=VAR | Store the output in this variable
-InformationAction=ACTION | What to do for information messages
-WhatIf | Show what WOULD happen without doing it (safe dry run)
-Confirm | Ask for confirmation before acting`);
const PS_COMMON_IDX = indexFlags(PS_COMMON);
function P(names, d, o) {
  names = [].concat(names);
  const spec = build('windows', names, d, Object.assign({ ps: true }, o || {}), null);
  spec.psNames = names;
  names.forEach(n => {
    const k = n.toLowerCase();
    if (DB.windows[k]) DB.psAlias[k] = spec; else DB.windows[k] = spec;
  });
  return spec;
}

/* ============ Tokenizer ============ */
function matchOp(src, i, mode, prevIsStart) {
  const rest = src.slice(i, i + 5);
  let m;
  if ((m = rest.match(/^(\d)?>&(\d|-)/))) return { raw: m[0], op: 'dup', fd: m[1] || '1', to: m[2] };
  if ((m = rest.match(/^(\d)?>>/))) return { raw: m[0], op: '>>', fd: m[1] || '1' };
  if (mode === 'sh' && (m = rest.match(/^(\d)?>\|/))) return { raw: m[0], op: '>|', fd: m[1] || '1' };
  if ((m = rest.match(/^(\d)?>/))) return { raw: m[0], op: '>', fd: m[1] || '1' };
  if (mode === 'sh') {
    if (rest.startsWith('&>>')) return { raw: '&>>', op: '&>>' };
    if (rest.startsWith('&>')) return { raw: '&>', op: '&>' };
  }
  if (rest.startsWith('<<<')) return { raw: '<<<', op: '<<<' };
  if (rest.startsWith('<<')) return { raw: rest.startsWith('<<-') ? '<<-' : '<<', op: '<<' };
  if (rest[0] === '<') return { raw: '<', op: '<' };
  if (rest.startsWith('||')) return { raw: '||', op: '||' };
  if (mode === 'sh' && rest.startsWith('|&')) return { raw: '|&', op: '|&' };
  if (rest[0] === '|') return { raw: '|', op: '|' };
  if (rest.startsWith('&&')) return { raw: '&&', op: '&&' };
  if (mode === 'ps' && rest[0] === '&' && prevIsStart && /^&\s*["'$.\w]/.test(src.slice(i, i + 3))) return { raw: '&', op: 'call' };
  if (rest[0] === '&') return { raw: '&', op: '&' };
  if (rest[0] === ';') return { raw: ';', op: ';' };
  if (mode === 'sh' && (rest[0] === '(' || rest[0] === ')')) return { raw: rest[0], op: rest[0] };
  return null;
}

function tokenize(src, mode) {
  const toks = [];
  const n = src.length;
  const esc = mode === 'sh' ? '\\' : mode === 'cmd' ? '^' : '`';
  const singleQ = mode !== 'cmd';
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '#' && mode !== 'cmd') { toks.push({ t: 'comment', raw: src.slice(i), start: i, end: n }); break; }
    const last = toks[toks.length - 1];
    const op = matchOp(src, i, mode, !last || last.t === 'op');
    if (op) { toks.push({ t: 'op', op: op.op, raw: op.raw, fd: op.fd, to: op.to, start: i, end: i + op.raw.length }); i += op.raw.length; continue; }
    const start = i;
    let val = '', sub = false, block = false, unclosed = false;
    const qs = new Set();
    while (i < n) {
      const ch = src[i];
      if (/\s/.test(ch)) break;
      if (ch === esc && i + 1 < n) { val += src[i + 1]; i += 2; qs.add('e'); continue; }
      if (ch === '|' || ch === '&' || ch === ';' || ch === '<' || ch === '>') break;
      if (mode === 'sh' && ch === ')') break;
      if (ch === '"') {
        let j = i + 1;
        while (j < n && src[j] !== '"') j += (src[j] === esc && mode !== 'cmd' && j + 1 < n) ? 2 : 1;
        if (j >= n) unclosed = true;
        val += src.slice(i + 1, Math.min(j, n)); i = j + 1; qs.add('d'); continue;
      }
      if (ch === "'" && singleQ) {
        const j = src.indexOf("'", i + 1);
        if (j < 0) { unclosed = true; val += src.slice(i + 1); i = n; }
        else { val += src.slice(i + 1, j); i = j + 1; }
        qs.add('s'); continue;
      }
      if (ch === '$' && src[i + 1] === '(' && mode !== 'cmd') {
        let j = i + 2, d = 1;
        while (j < n && d > 0) { if (src[j] === '(') d++; else if (src[j] === ')') d--; j++; }
        val += src.slice(i, j); i = j; sub = true; continue;
      }
      if (ch === '$' && src[i + 1] === '{' && mode === 'sh') {
        const j = src.indexOf('}', i);
        const e = j < 0 ? n : j + 1;
        val += src.slice(i, e); i = e; continue;
      }
      if (ch === '`' && mode === 'sh') {
        const j = src.indexOf('`', i + 1);
        const e = j < 0 ? n : j + 1;
        val += src.slice(i, e); i = e; sub = true; continue;
      }
      if (mode === 'ps' && (ch === '{' || ch === '(' || ((ch === '@') && (src[i + 1] === '(' || src[i + 1] === '{')))) {
        let j = ch === '@' ? i + 1 : i;
        const open = src[j], close = open === '{' ? '}' : ')';
        let d = 0, q = '';
        for (; j < n; j++) {
          const x = src[j];
          if (q) { if (x === q) q = ''; continue; }
          if (x === '"' || x === "'") { q = x; continue; }
          if (x === open) d++;
          else if (x === close) { d--; if (d === 0) { j++; break; } }
        }
        val += src.slice(i, j); i = j; block = true; continue;
      }
      val += ch; i++;
    }
    const raw = src.slice(start, i);
    const quote = qs.size === 0 ? '' : (qs.size === 1 ? [...qs][0] : 'm');
    toks.push({ t: 'word', raw, val, start, end: i, quote, sub, block, unclosed });
  }
  return toks;
}

/* ============ Describers ============ */
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lcFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
function shortDesc(d) {
  let s = (d || '').split(/[.;(]/)[0].trim();
  if (s.length > 72) s = s.slice(0, 70).replace(/\s+\S*$/, '') + '…';
  return lcFirst(s);
}

function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 3) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

/* Notes about how the shell treats a word: globs, variables, quotes... */
function shellNote(tk, mode) {
  const notes = [];
  const raw = tk.raw, val = tk.val;
  if (mode === 'sh') {
    if (tk.quote === 's') notes.push('Single quotes: the text is taken literally, with no expansion.');
    else if (tk.quote === 'd') notes.push('Double quotes keep this as one argument (spaces included); $variables inside are still expanded.');
    if (tk.sub) notes.push('Command substitution: the shell runs the inner command first and pastes its output here.');
    if (!tk.quote && /^~/.test(raw)) notes.push('~ expands to your home directory.');
    if (!tk.quote && /[*?\[]/.test(raw) && !tk.sub) notes.push('Wildcard: the shell expands this into every matching file name before the command runs.');
    if (tk.quote !== 's') {
      const vars = (raw.match(/\$\{?[A-Za-z_][A-Za-z0-9_]*\}?|\$[?$!#@*0-9]/g) || []);
      if (vars.length && !tk.sub) notes.push(`${[...new Set(vars)].join(', ')} ${vars.length > 1 ? 'are' : 'is'} replaced by the variable’s value${/\$\?/.test(raw) ? ' ($? is the exit status of the last command)' : ''}.`);
    }
    if (val === '/dev/null') notes.push('/dev/null is a black hole: anything written there is thrown away.');
    if (val === '-') notes.push('A lone "-" usually means standard input or standard output.');
    if (/^\/[^\s]*/.test(val) && !/^\/dev\/null$/.test(val)) notes.push('Absolute path: starts at the root of the file system.');
    else if (/^\.\.?\//.test(val)) notes.push('Relative path: "." is the current directory, ".." is its parent.');
  } else if (mode === 'cmd') {
    if (/%[^%\s]+%/.test(raw)) notes.push(`${(raw.match(/%[^%\s]+%/g) || []).join(', ')} ${(raw.match(/%[^%\s]+%/g) || []).length > 1 ? 'are' : 'is'} replaced by the environment variable’s value.`);
    if (tk.quote === 'd') notes.push('Double quotes keep a path or text with spaces together as one argument.');
    if (/[*?]/.test(val)) notes.push('Wildcard: * matches any characters, ? matches one character.');
    if (/^[A-Za-z]:\\?/.test(val)) notes.push(`Absolute path on drive ${val[0].toUpperCase()}:.`);
    else if (/^\\\\/.test(val)) notes.push('UNC path: a shared folder on another computer (\\\\server\\share).');
    else if (/^\.\.?(\\|$)/.test(val)) notes.push('Relative path: "." is the current folder, ".." is its parent.');
    if (/^nul$/i.test(val)) notes.push('NUL is the Windows black hole: output sent there is discarded.');
  } else {
    if (tk.quote === 's') notes.push('Single quotes: a literal string; variables are not expanded.');
    else if (tk.quote === 'd') notes.push('Double quotes: a string in which $variables and $(...) are expanded.');
    if (/\$env:[A-Za-z_]+/i.test(raw)) notes.push(`${(raw.match(/\$env:[A-Za-z_]+/gi) || [])[0]} reads a Windows environment variable.`);
    if (/\$_/.test(raw) && !tk.block) notes.push('$_ is the current object flowing through the pipeline.');
    if (/^\$(true|false|null)$/i.test(val)) notes.push('Built-in constant (boolean true/false or null).');
    if (/[*?]/.test(val) && !tk.block) notes.push('Wildcard: * matches any characters, ? matches one character.');
    if (/^[A-Za-z]:\\?/.test(val)) notes.push(`Absolute path on drive ${val[0].toUpperCase()}:.`);
    else if (/^\.\.?(\\|\/|$)/.test(val)) notes.push('Relative path: "." is the current folder, ".." is its parent.');
    if (/^~/.test(val)) notes.push('~ is your user profile folder.');
    if (/^\$null$/i.test(val)) notes.push('$null discards output when used as a redirect target.');
    if (tk.block) notes.push(psBlockNote(tk.raw));
  }
  return notes;
}

function psBlockNote(raw) {
  const ops = { '-eq': 'equals', '-ne': 'not equal', '-gt': 'greater than', '-lt': 'less than', '-ge': 'greater or equal', '-le': 'less or equal', '-like': 'wildcard match', '-notlike': 'wildcard mismatch', '-match': 'regex match', '-notmatch': 'regex mismatch', '-contains': 'collection contains', '-in': 'value in collection', '-and': 'logical AND', '-or': 'logical OR', '-not': 'logical NOT', '-replace': 'regex replace', '-split': 'split text', '-join': 'join items' };
  const found = Object.keys(ops).filter(k => new RegExp('(^|[\\s(])' + k + '(?=[\\s)]|$)', 'i').test(raw));
  let s;
  if (/^@\{/.test(raw)) s = 'Hashtable literal: key = value pairs.';
  else if (/^@\(/.test(raw)) s = 'Array literal.';
  else if (/^\(/.test(raw)) s = 'Parentheses: this part is evaluated first and its result is used here.';
  else s = 'Script block: a chunk of PowerShell code' + (/\$_/.test(raw) ? '; inside it $_ is the current pipeline object' : '') + '.';
  if (found.length) s += ' Operators used: ' + found.map(k => `${k} (${ops[k]})`).join(', ') + '.';
  return s;
}

function opInfo(t, mode) {
  const sh = mode === 'sh';
  switch (t.op) {

    const units = res.seq.filter(s => s.type === 'unit').length;
    let html = '', n = 0;
    res.seq.forEach(item => {
      if (item.type === 'op') {
        const p = item.part;
        html += `<div class="link"><div class="joiner" data-id="${p.id}"><div class="tok"><span class="chip k-op">${esc(p.text)}</span></div><div class="what"><div class="kind">Operator${p.opLabel ? ' &middot; ' + esc(p.opLabel) : ''}</div><p>${esc(p.desc || '')}</p></div></div></div>`;
        return;
      }
      n++;
      const u = item.unit;
      const names = (u.layers || []).map(l => `<span class="chip k-command">${esc(l.name)}</span>`).join(' &rarr; ');
      const head = u.envOnly ? 'Shell variable assignment' : (names || 'Redirection');
      html += `<section class="unit" aria-label="Part ${n}"><div class="unit-head"><span class="stage">${units > 1 ? `Part ${n} of ${units}` : 'Breakdown'}</span><span class="head-text">${head}</span></div>${u.parts.map(rowHTML).join('')}</section>`;
    });
    return html;
  }

  function emptyState() {
    return `<div class="empty"><b>Nothing to decode yet.</b>Type a ${OSNAME[os]} command above, or pick one of the examples.</div>`;
  }

  let lastRes = null;
  function render() {
    const text = ta.value;
    let res;
    try { res = explain(text, os); }
    catch (err) {
      console.error(err);
      out.innerHTML = `<div class="banners"><div class="banner caution"><b>Parser error</b><p>Something in that command confused the decoder. Try simplifying it, for example by removing quotes or nested parentheses.</p></div></div>`;
      return;
    }
    lastRes = res;
    updateShell(res);
    if (res.empty) { out.innerHTML = emptyState(); return; }
    out.innerHTML = banners(res) + stepsCard(res) + anatomyCard(res) + `<div class="stack" aria-label="Breakdown of each piece">${breakdown(res)}</div>`;
  }

  function updateShell(res) {
    const badge = $('shellBadge'), prompt = $('prompt');
    if (os === 'linux') { badge.textContent = 'bash'; prompt.textContent = '$'; return; }
    if (res && !res.empty) {
      badge.textContent = res.mode === 'ps' ? 'PowerShell' : 'cmd.exe';
      prompt.textContent = res.mode === 'ps' ? 'PS>' : 'C:\\>';
    } else { badge.textContent = 'cmd / PowerShell'; prompt.textContent = 'C:\\>'; }
  }

  /* ---------- OS menu, examples, library ---------- */
  function uniqueSpecs(db) {
    const seen = new Set(), list = [];
    Object.keys(db).forEach(k => { const s = db[k]; if (s && !seen.has(s)) { seen.add(s); list.push(s); } });
    return list;
  }
  function specLabel(s) { return (s.psNames && s.psNames[0]) || s.name; }

  function buildOSParts() {
    $('tryRow').innerHTML = '<span class="lbl">Try:</span>' + SAMPLES[os].slice(0, 6).map(c => `<button type="button" class="ex" data-cmd="${esc(c)}" title="${esc(c)}">${esc(c)}</button>`).join('');
    ta.placeholder = os === 'linux' ? 'e.g. ls -la /var/log' : 'e.g. ipconfig /all   or   Get-Process';
    let specs = uniqueSpecs(DB[os]);
    if (os === 'windows') specs = specs.filter(s => !(DB.linux && Object.values(DB.linux).includes(s)));
    const names = [...new Set(specs.map(specLabel))].sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    $('libTitle').textContent = `Commands I can explain on ${OSNAME[os]} (${names.length})`;
    $('libBody').innerHTML = names.map(n => `<button type="button" class="ex" data-cmd="${esc(n)}">${esc(n)}</button>`).join('');
    const nl = new Set(Object.values(DB.linux)).size, nw = new Set(Object.values(DB.windows)).size;
    $('foot').textContent = `Everything runs in your browser; nothing you type is sent anywhere. The reference covers ${nl} Linux commands and ${nw} Windows commands and cmdlets. Anything outside it is marked as not recognised instead of guessed. For the full details use man or --help on Linux, and /? or Get-Help on Windows.`;
  }

  function setOS(next, keepText) {
    const prevSamples = SAMPLES[os];
    const wasSample = !ta.value.trim() || prevSamples.includes(ta.value.trim());
    os = next;
    try { localStorage.setItem('cmd-decoder-os', os); } catch (e) { /* ignore */ }
    ['linux', 'windows'].forEach(k => {
      const b = $(k === 'linux' ? 'osLinux' : 'osWindows');
      b.setAttribute('aria-checked', String(k === os));
      b.tabIndex = k === os ? 0 : -1;
    });
    buildOSParts();
    if (!keepText && wasSample) ta.value = SAMPLES[os][0];
    grow(); render();
  }

  function grow() { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }
  let timer = null;
  ta.addEventListener('input', () => { grow(); clearTimeout(timer); timer = setTimeout(render, 60); });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); clearTimeout(timer); render(); } });
  $('clearBtn').addEventListener('click', () => { ta.value = ''; grow(); render(); ta.focus(); });
  window.addEventListener('resize', grow);

  $('osSeg').addEventListener('click', e => { const b = e.target.closest('button[data-os]'); if (b && b.dataset.os !== os) setOS(b.dataset.os); });
  $('osSeg').addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const next = os === 'linux' ? 'windows' : 'linux';
    setOS(next); $(next === 'linux' ? 'osLinux' : 'osWindows').focus();
  });

  function loadCommand(c) { ta.value = c; grow(); render(); ta.focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  document.addEventListener('click', e => {
    const ex = e.target.closest('[data-cmd]');
    if (ex) { loadCommand(ex.dataset.cmd); return; }
    const sw = e.target.closest('[data-switch]');
    if (sw) { setOS(sw.dataset.switch, true); return; }
    const fix = e.target.closest('[data-fix]');
    if (fix) { const re = new RegExp('(^|[\\s|;&(])' + fix.dataset.fix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=$|[\\s|;&)])'); ta.value = ta.value.replace(re, '$1' + fix.dataset.with); grow(); render(); return; }
    const t = e.target.closest('#out [data-id]');
    if (t) { pin(t.dataset.id, true); return; }
    clearHl();
  });

  /* ---------- linked highlighting between the colour-coded line and the rows ---------- */
  let pinned = null;
  function setHl(id, on) { out.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.toggle('hl', on)); }
  function clearHl() { if (pinned != null) setHl(pinned, false); pinned = null; }
  function pin(id, scroll) {
    clearHl(); pinned = id; setHl(id, true);
    if (scroll) { const row = out.querySelector(`.row[data-id="${id}"], .joiner[data-id="${id}"]`); if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
  out.addEventListener('mouseover', e => { const t = e.target.closest('[data-id]'); if (t && t.dataset.id !== pinned) setHl(t.dataset.id, true); });
  out.addEventListener('mouseout', e => { const t = e.target.closest('[data-id]'); if (t && t.dataset.id !== pinned) setHl(t.dataset.id, false); });
  out.addEventListener('focusin', e => { const t = e.target.closest('[data-id]'); if (t) setHl(t.dataset.id, true); });
  out.addEventListener('focusout', e => { const t = e.target.closest('[data-id]'); if (t && t.dataset.id !== pinned) setHl(t.dataset.id, false); });

  /* ---------- start ---------- */
  ta.value = SAMPLES[os][0];
  setOS(os, true);
})();
</script>

</body></html>
